<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Impact, Resettlement & Safeguards Portfolio</title>
<meta name="description" content="Portfolio of social impact assessment, resettlement and stakeholder engagement projects across Australia, Southeast Asia, Bhutan and the Pacific.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --slate:#1f2d3a; --slate-2:#475569; --teal:#0f766e; --teal-soft:#d9eeeb;
  --sage:#8aa399; --sage-soft:#eef3f0; --grey:#f4f6f7; --line:#e2e8e6; --white:#fff;
  --shadow:0 1px 2px rgba(15,35,45,.05),0 8px 24px rgba(15,35,45,.07);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;color:var(--slate);background:var(--grey);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--teal)}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
header.nav{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;justify-content:space-between;align-items:center;height:64px}
.brand{font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--teal)}
.nav nav a{margin-left:22px;text-decoration:none;color:var(--slate-2);font-size:.9rem;font-weight:500}
.nav nav a:hover{color:var(--teal)}
.hero{padding:96px 0 72px;background:linear-gradient(160deg,#fff 0%,var(--sage-soft) 100%)}
.eyebrow{display:inline-block;font-size:.78rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);background:var(--teal-soft);padding:6px 12px;border-radius:99px}
.hero h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.1;letter-spacing:-.03em;margin:20px 0;max-width:820px;font-weight:700}
.hero p{max-width:640px;color:var(--slate-2);font-size:1.1rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:44px;max-width:760px}
.stat{background:#fff;border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.8rem;color:var(--teal);letter-spacing:-.02em}
.stat small{color:var(--slate-2)}
section{padding:72px 0}
h2{font-size:1.8rem;letter-spacing:-.02em;margin-bottom:8px}
.lead{color:var(--slate-2);margin-bottom:32px;max-width:640px}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
#map{height:540px;border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);z-index:1}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font-size:.85rem;color:var(--slate-2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:middle}
.pin{width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.leaflet-popup-content-wrapper{border-radius:12px}
.leaflet-popup-content{font-family:'Inter',sans-serif;font-size:.85rem;line-height:1.5;margin:14px 16px}
.leaflet-popup-content h4{font-size:.95rem;margin-bottom:6px;color:var(--slate)}
.leaflet-popup-content p{margin:2px 0}
.leaflet-popup-content .k{color:var(--teal);font-weight:600}
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center}
.chartbox{padding:28px;height:400px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tag{background:var(--sage-soft);color:var(--slate);padding:6px 12px;border-radius:99px;font-size:.82rem;font-weight:500}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.filters button{font:inherit;font-size:.85rem;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--slate-2);padding:8px 16px;border-radius:99px;cursor:pointer;transition:.2s}
.filters button.on,.filters button:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.proj{padding:24px;transition:transform .2s,box-shadow .2s}
.proj:hover{transform:translateY(-3px)}
.proj .cat{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.proj h3{font-size:1.05rem;margin:8px 0;letter-spacing:-.01em}
